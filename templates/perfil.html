
{% extends 'base.html' %}

{% block title %}Mi perfil{% endblock %}

{% block content %}

<div class="card shadow-sm">
    <div class="card-body">

        <h1 class="h3 mb-3">Mi perfil</h1>

        <p>
            ¡Bienvenido, <strong>{{ usuario.nombre }}</strong>!
        </p>

        <p>
            Correo electrónico: {{ usuario.correo }}
        </p>

        <a href="{{ url_for('logout') }}" class="btn btn-danger">
            Cerrar sesión
        </a>

    </div>
</div>

{% endblock %}
